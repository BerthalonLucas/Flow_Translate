name: Release
# Publishes the Windows installer as a GitHub release: on a tag `v*`, or by hand with the
# tag to publish (pushes do not always reach Actions on this repository).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à publier (par exemple v0.2.1), déjà poussé'
        required: true
        type: string
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --bundles nsis
      - name: Publish the installer and its SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw 'Aucun installateur NSIS produit.' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii SHA256SUMS.txt
          # The first section of docs/RELEASE-NOTES.md is this version's note.
          $lines = Get-Content docs/RELEASE-NOTES.md
          $starts = @(); for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -like '# *') { $starts += $i } }
          $end = if ($starts.Count -gt 1) { $starts[1] - 1 } else { $lines.Count - 1 }
          $lines[$starts[0]..$end] | Set-Content -Encoding utf8 release-notes.md
          Add-Content release-notes.md ""
          Add-Content release-notes.md "SHA-256 de l’installateur : ``$hash``"
          $exists = $true
          try { gh release view $tag *> $null } catch { $exists = $false }
          if ($LASTEXITCODE -ne 0) { $exists = $false }
          if ($exists) {
            gh release upload $tag $exe.FullName SHA256SUMS.txt --clobber
          } else {
            gh release create $tag $exe.FullName SHA256SUMS.txt --title "FlowTranslate $tag" --notes-file release-notes.md --verify-tag
          }
