name: flowtranslate

x-engine: &engine
  image: vllm/vllm-openai:v0.28.0@sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14
  ipc: host
  environment:
    CUDA_DEVICE_ORDER: PCI_BUS_ID
    VLLM_LOGGING_LEVEL: WARNING
    HF_HUB_DISABLE_TELEMETRY: "1"
    DO_NOT_TRACK: "1"
    VLLM_NO_USAGE_STATS: "1"
  volumes:
    - model-cache:/root/.cache/huggingface
    - compile-cache:/root/.cache/vllm
  restart: "no"
  healthcheck:
    test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
    interval: 15s
    timeout: 8s
    start_period: 600s
    retries: 4
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "2"

services:
  fast:
    <<: *engine
    profiles: [fast]
    ports: ["127.0.0.1:${FAST_PORT:-8001}:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${FAST_GPU:-1}"]
              capabilities: [gpu]
    command:
      - --model
      - tencent/Hy-MT2-1.8B
      - --revision
      - 9a341cd1b679d3efd23b46e847b01745a71ed792
      - --served-model-name
      - flowtranslate-fast
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - bfloat16
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "10"
      - --gpu-memory-utilization
      - "${FAST_GPU_MEMORY:-0.45}"
      - --no-enable-log-requests
      - --max-log-len
      - "0"
      - --uvicorn-log-level
      - warning
  quality:
    <<: *engine
    profiles: [quality]
    ports: ["127.0.0.1:${QUALITY_PORT:-8002}:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${QUALITY_GPU:-0}"]
              capabilities: [gpu]
    command:
      - --model
      - tencent/Hy-MT2-7B-FP8
      - --revision
      - 883d09eb21d9be92058556cd0a4016d8a648c7db
      - --served-model-name
      - flowtranslate-quality
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - auto
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "10"
      - --gpu-memory-utilization
      - "${QUALITY_GPU_MEMORY:-0.80}"
      - --no-enable-log-requests
      - --max-log-len
      - "0"
      - --uvicorn-log-level
      - warning

volumes:
  model-cache:
  compile-cache:

