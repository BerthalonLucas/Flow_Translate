<!-- @dsCard group="Réglages · blocs" height=584 subtitle="Un profil de moteur : statut, vérification, adresse, modèle, clé" -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>EngineCard — aperçu</title>
<style> .col { display: grid; gap: 12px; padding: 20px 24px; max-width: 640px; } </style></head>
<body>
<div class="col" id="root"></div>
<script>
  var F = window.FlowTranslate, h = React.createElement, useState = React.useState;
  function Demo() {
    var s = useState('ok'), status = s[0], setStatus = s[1];
    var check = function () { setStatus('checking'); setTimeout(function () { setStatus('ok'); }, 900); };
    return h(React.Fragment, null,
      h(F.EngineCard, { name: 'Qualité', isDefault: true, status: status, latency: 38, endpoint: 'http://127.0.0.1:8002/v1', model: 'flowtranslate-quality', apiKey: '', onCheck: check }),
      h(F.EngineCard, { name: 'Rapide', status: 'error', endpoint: 'http://127.0.0.1:8001/v1', model: 'flowtranslate-fast', apiKey: '', message: 'Aucune réponse de 127.0.0.1:8001. Démarrez le serveur, puis vérifiez.' }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
