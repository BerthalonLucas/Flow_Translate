<!-- @dsCard group="Overlay" height=110 subtitle="Roue, balayage après 1,5 s, coche une fois collé" -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>WaitPill — aperçu</title>
<style>
  body { background: var(--surface); }
  .row { display: flex; gap: 40px; padding: 24px 28px; }
  .item { display: grid; gap: 10px; justify-items: center; }
  .label { color: var(--ink-muted); font: 400 12px/16px var(--font-small); }
</style></head>
<body>
<div class="row" id="root"></div>
<script>
  var F = window.FlowTranslate, h = React.createElement;
  function Item(label, props) { return h('div', { className: 'item' }, h(F.WaitPill, props), h('span', { className: 'label' }, label)); }
  function Cycle() {
    var s = React.useState(0), step = s[0], setStep = s[1];
    React.useEffect(function () { var t = setTimeout(function () { setStep((step + 1) % 3); }, step === 2 ? 900 : 1500); return function () { clearTimeout(t); }; }, [step]);
    return Item('Mode Remplacer, en boucle', { slow: step === 1, done: step === 2 });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    Item('En cours', {}), Item('Plus de 1,5 s', { slow: true }), Item('Collé', { done: true }), h(Cycle)));
</script>
</body>
</html>
