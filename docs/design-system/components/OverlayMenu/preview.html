<!-- @dsCard group="Overlay" height=280 subtitle="Six entrées au plus, icônes, séparateur avant Fermer" -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>OverlayMenu — aperçu</title>
<style>
  body { background: var(--surface); }
  .row { display: flex; gap: 32px; padding: 20px 24px; align-items: flex-start; }
  .label { margin: 0 0 8px; color: var(--ink-muted); font: 400 12px/16px var(--font-small); }
</style></head>
<body>
<div class="row" id="root"></div>
<script>
  var F = window.FlowTranslate, h = React.createElement;
  var noop = function () {};
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', null, h('p', { className: 'label' }, 'Résultat affiché'), h(F.OverlayMenu, { items: [
      { icon: 'eye', label: 'Afficher l’original', onSelect: noop },
      { icon: 'clipboard-paste', label: 'Remplacer', highlighted: true, onSelect: noop },
      { icon: 'refresh-cw', label: 'Relancer en Rapide', onSelect: noop },
      { icon: 'settings-2', label: 'Réglages', onSelect: noop },
      { icon: 'x', label: 'Fermer', hint: 'Échap', separatorBefore: true, onSelect: noop }] })),
    h('div', null, h('p', { className: 'label' }, 'Après une erreur, pendant le travail'), h(F.OverlayMenu, { items: [
      { icon: 'eye-off', label: 'Masquer l’original', disabled: true },
      { icon: 'rotate-ccw', label: 'Réessayer', onSelect: noop },
      { icon: 'refresh-cw', label: 'Relancer en Qualité', disabled: true },
      { icon: 'settings-2', label: 'Réglages', onSelect: noop },
      { icon: 'x', label: 'Fermer', hint: 'Échap', separatorBefore: true, onSelect: noop }] }))
  ));
</script>
</body>
</html>
