<!-- @dsCard group="Réglages · contrôles" height=150 subtitle="Principal, secondaire, discret, suppression ; bouton d’icône" -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Button — aperçu</title>
<style> .col { display: grid; gap: 14px; padding: 20px 24px; } .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; } </style></head>
<body>
<div class="col" id="root"></div>
<script>
  var F = window.FlowTranslate, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'row' },
      h(F.Button, { variant: 'primary', icon: 'plus' }, 'Nouvelle action'),
      h(F.Button, { icon: 'refresh-cw' }, 'Vérifier'),
      h(F.Button, { variant: 'ghost' }, 'Modifier'),
      h(F.Button, { variant: 'danger', icon: 'trash-2' }, 'Supprimer l’action'),
      h(F.Button, { disabled: true }, 'Vérification…')),
    h('div', { className: 'row' },
      h(F.Button, { variant: 'primary', size: 'sm' }, 'Réessayer'),
      h(F.Button, { size: 'sm', icon: 'refresh-cw' }, 'Vérifier'),
      h(F.Button, { variant: 'ghost', size: 'sm', icon: 'plus' }, 'Ajouter un raccourci'),
      h(F.Button, { variant: 'danger', size: 'sm' }, 'Tout supprimer'),
      h(F.IconButton, { icon: 'trash-2', label: 'Supprimer cette entrée', variant: 'danger' }),
      h(F.IconButton, { icon: 'x', label: 'Fermer' }))
  ));
</script>
</body>
</html>
