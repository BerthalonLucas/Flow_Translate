<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>TextArea — aperçu</title>
<style> .pad { padding: 20px 24px; max-width: 640px; } </style></head>
<body>
<div class="pad" id="root"></div>
<script>
  var F = window.FlowTranslate, h = React.createElement, useState = React.useState;
  function Demo() {
    var a = useState('You are an editor. Rewrite the text in a clear, courteous, professional tone, in the same language, with the same meaning and a similar length. Keep names, numbers and facts.\n\nOutput only the resulting text: no preamble, no explanation, no quotes around it, no code fences.'), v = a[0], set = a[1];
    return h(F.TextArea, { label: 'Consigne', value: v, onChange: set, rows: 6, hint: 'Écrivez la langue voulue dans la consigne ; le texte sélectionné suit.', error: v.trim() ? null : 'La consigne doit contenir de 1 à 8 000 caractères.' });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
